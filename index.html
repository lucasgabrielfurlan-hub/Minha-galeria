  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #0d1b2a; /* Azul escuro tricolor */
      color: #fff;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      color: #00a0e3; /* Azul Grêmio */
      font-size: 3rem;
      text-shadow: 2px 2px 5px #000;
    }

    .subtitle {
      color: #ffffff;
      font-size: 1.2rem;
      margin-top: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 colunas */
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-color: #1b263b;
    }

    .gallery-item:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(0, 160, 227, 0.4);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9rem;
      color: #a0d2ff;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr); /* 2 colunas em tablets */
      }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr; /* 1 coluna em mobile */
      }
    }
  </style>
